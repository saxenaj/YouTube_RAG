[pytest]
# Pytest configuration for YouTube RAG System

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Minimum Python version
minversion = 3.10

# Command line options
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    
# Custom markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (require services)
    unit: marks tests as unit tests (no external dependencies)
    api: marks tests that test API endpoints
    services: marks tests that test services
    
# Coverage options (if using pytest-cov)
# addopts = --cov=app --cov-report=html --cov-report=term

# Log configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Ignore warnings from specific libraries
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning